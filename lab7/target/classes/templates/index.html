<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 18px 40px;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 30px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .card-header h2 {
            font-size: 22px;
            color: #2c3e50;
        }

        .btn {
            display: inline-block;
            padding: 9px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #d68910; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-secondary:hover { background: #7f8c8d; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead tr {
            background: #2c3e50;
            color: white;
        }

        thead th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
        }

        tbody tr {
            border-bottom: 1px solid #ecf0f1;
            transition: background 0.15s;
        }

        tbody tr:hover { background: #f8f9fa; }

        tbody td {
            padding: 12px 16px;
            color: #34495e;
        }

        .actions { display: flex; gap: 8px; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #95a5a6;
            font-size: 15px;
        }
    </style>
</head>
<body>

<header>Employee Management System</header>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Employees List</h2>
            <a th:href="@{/showAddEmployeeForm}" class="btn btn-primary">+ Add Employee</a>
        </div>

        <table th:if="${not #lists.isEmpty(employeeList)}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="employee : ${employeeList}">
                    <td th:text="${employee.id}"></td>
                    <td th:text="${employee.firstName}"></td>
                    <td th:text="${employee.lastName}"></td>
                    <td th:text="${employee.emailId}"></td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/showUpdateForm/{id}(id=${employee.id})}" class="btn btn-warning">Edit</a>
                            <a th:href="@{/deleteEmployee/{id}(id=${employee.id})}" class="btn btn-danger"
                               onclick="return confirm('Delete this employee?')">Delete</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="empty-state" th:if="${#lists.isEmpty(employeeList)}">
            No employees found. Click <strong>+ Add Employee</strong> to get started.
        </div>
    </div>
</div>

</body>
</html>
