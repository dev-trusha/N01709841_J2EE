<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .login-container {
            background: white;
            padding: 40px;
            border: 1px solid #ccc;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
        }
        table {
            margin: 0 auto;
        }
        td {
            padding: 5px 10px;
            text-align: left;
        }
        input[type="text"], input[type="password"] {
            padding: 4px;
            width: 180px;
        }
        input[type="submit"] {
            margin-top: 10px;
            padding: 4px 12px;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
        .signup-link {
            margin-top: 15px;
            font-weight: bold;
        }
        .signup-link a {
            color: purple;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Enter Login Details</h2>

    <!--
        Spring Security intercepts POST /login automatically.
        Thymeleaf's th:action adds the CSRF hidden token to the form.
    -->
    <form th:action="@{/login}" method="post">
        <table>
            <tr>
                <td>Username</td>
                <td><input type="text" name="username" required /></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="password" required /></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Login" /></td>
            </tr>
        </table>
    </form>

    <!-- Spring Security sets ?error when login fails -->
    <p class="error" th:if="${param.error}">Invalid Username/Password. Please try again.</p>

    <!-- Shown after successful registration redirect -->
    <p class="success" th:if="${param.registered}">Registration successful! Please login now.</p>

    <!-- Shown after logout -->
    <p class="success" th:if="${successMessage}" th:text="${successMessage}"></p>

    <p class="signup-link">Click Here for new account: <a th:href="@{/signup}">Add User</a></p>
</div>
</body>
</html>
