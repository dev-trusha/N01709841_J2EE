<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .home-container {
            text-align: center;
        }
        h2 {
            font-weight: bold;
        }
        form {
            margin-top: 20px;
        }
        input[type="submit"] {
            background: none;
            border: none;
            color: purple;
            cursor: pointer;
            font-size: 1em;
            text-decoration: underline;
            padding: 0;
        }
        input[type="submit"]:hover {
            color: darkviolet;
        }
    </style>
</head>
<body>
<div class="home-container">
    <h2>Welcome <span th:text="${firstName}"></span> <span th:text="${lastName}"></span>!</h2>

    <!--
        Spring Security requires a POST request to /logout.
        Thymeleaf's th:action automatically includes the CSRF token.
    -->
    <form th:action="@{/logout}" method="post">
        <input type="submit" value="Logout" />
    </form>
</div>
</body>
</html>
