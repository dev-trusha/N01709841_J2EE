<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .signup-container {
            background: white;
            padding: 40px;
            border: 1px solid #ccc;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
        }
        table {
            margin: 0 auto;
        }
        td {
            padding: 5px 10px;
            text-align: left;
        }
        input[type="text"], input[type="password"], input[type="date"] {
            padding: 4px;
            width: 180px;
        }
        input[type="submit"] {
            margin-top: 10px;
            padding: 4px 12px;
        }
    </style>
</head>
<body>
<div class="signup-container">
    <h2>User Sign Up</h2>
    <form th:action="@{/signup}" method="post" th:object="${user}">
        <table>
            <tr>
                <td>First Name</td>
                <td><input type="text" th:field="*{firstName}" required /></td>
            </tr>
            <tr>
                <td>Last Name</td>
                <td><input type="text" th:field="*{lastName}" required /></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="text" th:field="*{email}" required /></td>
            </tr>
            <tr>
                <td>Username</td>
                <td><input type="text" th:field="*{username}" required /></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" th:field="*{password}" required /></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" th:field="*{gender}" value="Male" /> Male
                    <input type="radio" th:field="*{gender}" value="Female" /> Female
                </td>
            </tr>
            <tr>
                <td>Date of birth</td>
                <td><input type="date" th:field="*{dob}" /></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="SignUp" /></td>
            </tr>
        </table>
    </form>
</div>
</body>
</html>
