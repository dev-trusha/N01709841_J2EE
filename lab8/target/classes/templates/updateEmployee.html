<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-group input:focus { border-color: #f39c12; box-shadow: 0 0 0 3px rgba(243,156,18,0.15); }
    </style>
</head>
<body>

<header>
    <img th:src="@{/images/logo.svg}" alt="EMS Logo">
    Employee Management System
</header>

<div class="container-sm">
    <div class="card">
        <h2>Update Employee</h2>
        <form action="#" th:action="@{/updateEmployee}" th:object="${employee}" method="post">
            <div class="form-group">
                <label>ID</label>
                <input type="text" th:field="*{id}" readonly>
            </div>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" th:field="*{firstName}" placeholder="Enter first name"
                       th:classappend="${#fields.hasErrors('firstName')} ? 'input-error'">
                <span class="error-msg" th:if="${#fields.hasErrors('firstName')}"
                      th:errors="*{firstName}"></span>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" th:field="*{lastName}" placeholder="Enter last name"
                       th:classappend="${#fields.hasErrors('lastName')} ? 'input-error'">
                <span class="error-msg" th:if="${#fields.hasErrors('lastName')}"
                      th:errors="*{lastName}"></span>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="text" th:field="*{emailId}" placeholder="Enter email address"
                       th:classappend="${#fields.hasErrors('emailId')} ? 'input-error'">
                <span class="error-msg" th:if="${#fields.hasErrors('emailId')}"
                      th:errors="*{emailId}"></span>
            </div>
            <div class="form-actions">
                <input type="submit" value="Update Employee" class="btn btn-warning">
                <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<footer>
    &copy; 2025 Employee Management System &mdash; N01709841
</footer>

</body>
</html>
