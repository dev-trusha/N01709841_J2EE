<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <img th:src="@{/images/logo.svg}" alt="EMS Logo">
    Employee Management System
</header>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Employees List</h2>
            <a th:href="@{/showAddEmployeeForm}" class="btn btn-primary">+ Add Employee</a>
        </div>

        <table th:if="${not #lists.isEmpty(employeeList)}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="employee : ${employeeList}">
                    <td th:text="${employee.id}"></td>
                    <td th:text="${employee.firstName}"></td>
                    <td th:text="${employee.lastName}"></td>
                    <td th:text="${employee.emailId}"></td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/showUpdateForm/{id}(id=${employee.id})}" class="btn btn-warning">Edit</a>
                            <a th:href="@{/deleteEmployee/{id}(id=${employee.id})}" class="btn btn-danger"
                               onclick="return confirm('Delete this employee?')">Delete</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="empty-state" th:if="${#lists.isEmpty(employeeList)}">
            No employees found. Click <strong>+ Add Employee</strong> to get started.
        </div>
    </div>
</div>

<footer>
    &copy; 2025 Employee Management System &mdash; N01709841
</footer>

</body>
</html>
