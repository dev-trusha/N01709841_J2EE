<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Inventory</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; padding: 30px; }
        h1 { text-align: center; margin-bottom: 20px; color: #333; }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .btn { padding: 9px 18px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; text-decoration: none; }
        .btn-primary { background-color: #4CAF50; color: white; }
        .btn-primary:hover { background-color: #45a049; }
        .btn-warning { background-color: #ff9800; color: white; }
        .btn-warning:hover { background-color: #e68900; }
        .btn-danger { background-color: #f44336; color: white; }
        .btn-danger:hover { background-color: #d32f2f; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background-color: #4CAF50; color: white; padding: 12px 15px; text-align: left; }
        td { padding: 11px 15px; border-bottom: 1px solid #eee; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f9f9f9; }
        .actions { display: flex; gap: 8px; }
        .empty { text-align: center; padding: 30px; color: #888; }
    </style>
</head>
<body>
    <h1>Product Inventory Management System</h1>

    <div class="top-bar">
        <a th:href="@{/products/add}" class="btn btn-primary">+ Add New Product</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price ($)</th>
                <th>Stock</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="6" class="empty">No products found. Add one!</td>
            </tr>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td th:text="${product.name}"></td>
                <td th:text="${product.description}"></td>
                <td th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></td>
                <td th:text="${product.stock}"></td>
                <td>
                    <div class="actions">
                        <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-warning">Edit</a>
                        <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-danger"
                           onclick="return confirm('Delete this product?')">Delete</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
